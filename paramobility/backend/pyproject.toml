[project]
name = "paramobility-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2.5.4",  # delay model (app.prediction)
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "scipy>=1.18.1",
    "tzdata>=2024.1",  # time zone data for zoneinfo where the OS has none
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The paratransit simulator is its own package with its own conventions.
extend-exclude = ["paratransit-sim"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
