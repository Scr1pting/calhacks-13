[project]
name = "prediction"
version = "0.1.0"
description = "Research notebooks that fit the delay model baked into backend/app/prediction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
]
